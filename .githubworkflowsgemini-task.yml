name: Gemini Task Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instrução / Tarefa para o Gemini executar no repositório'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  gemini-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git User
        run: |
          git config --global user.name "gemini-agent[bot]"
          git config --global user.email "gemini-agent[bot]@users.noreply.github.com"

      - name: Executar Gemini CLI Agent
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: ${{ inputs.prompt }}